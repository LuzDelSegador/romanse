<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Ti 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --pink: #ff6b9d;
      --rose: #ff3366;
      --light-pink: #ffb3d1;
      --dark: #070010;
      --dark2: #0e0018;
      --text: #f5dde8;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ── CANVAS ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── INTRO ── */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a0030 0%, var(--dark) 70%);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    #intro.hidden { opacity: 0; transform: scale(1.08); pointer-events: none; }

    .intro-heart {
      font-size: 110px;
      cursor: pointer;
      animation: throb 1.3s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(255,50,100,0.8));
      transition: transform 0.1s;
      user-select: none;
    }
    .intro-heart:active { transform: scale(0.9); }

    @keyframes throb {
      0%,100% { transform: scale(1); }
      14%      { transform: scale(1.35); }
      28%      { transform: scale(1.05); }
      42%      { transform: scale(1.2); }
    }

    .intro-tagline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      color: var(--light-pink);
      margin-top: 28px;
      text-align: center;
      opacity: 0;
      animation: fadeUp 1.5s 0.5s forwards;
      padding: 0 20px;
    }

    .intro-hint {
      margin-top: 22px;
      font-size: 0.85rem;
      color: #9966aa;
      letter-spacing: 0.12em;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink { 0%,100%{ opacity:.4 } 50%{ opacity:1 } }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px) }
      to   { opacity:1; transform:translateY(0) }
    }

    /* ── MAIN ── */
    #page {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 70px 22px 100px;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #page.show { opacity: 1; }

/* ── GALLERY ── */
    .gallery-section {
      margin-top: 20px;
    }

    .gallery-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      color: var(--pink);
      text-align: center;
      margin-bottom: 10px;
      text-shadow: 0 0 30px rgba(255,107,157,.45);
    }

    .gallery-sub {
      text-align: center;
      font-style: italic;
      color: #c8a0bc;
      margin-bottom: 38px;
      font-size: .95rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      opacity: 0;
      transform: scale(.88) rotate(var(--rot, 0deg));
      transition: opacity .5s ease, transform .5s ease, box-shadow .3s ease;
      aspect-ratio: 1 / 1;
      background: #1a0030;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }

    .gallery-item:nth-child(odd)  { --rot:  1.5deg; }
    .gallery-item:nth-child(even) { --rot: -1.5deg; }
    .gallery-item:nth-child(3n)   { --rot:  .5deg;  }

    .gallery-item.pop {
      opacity: 1;
      transform: scale(1) rotate(var(--rot, 0deg));
    }

    .gallery-item:hover {
      transform: scale(1.07) rotate(0deg) !important;
      box-shadow: 0 0 28px rgba(255,107,157,.7), 0 8px 30px rgba(0,0,0,.5);
      z-index: 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }
    .gallery-item:hover img { transform: scale(1.1); }

    .gallery-item .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(180,0,80,.5) 0%, transparent 60%);
      opacity: 0;
      transition: opacity .3s ease;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
    }
    .gallery-item:hover .overlay { opacity: 1; }
    .overlay span { font-size: 1.5rem; }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      animation: lbFadeIn .3s ease;
    }
    #lightbox.open { display: flex; }

    @keyframes lbFadeIn { from { opacity:0 } to { opacity:1 } }

    #lb-img {
      max-width: 88vw;
      max-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(255,107,157,.4);
      animation: lbZoom .3s ease;
    }
    @keyframes lbZoom { from { transform:scale(.85) } to { transform:scale(1) } }

    #lb-close {
      position: absolute;
      top: 22px;
      right: 28px;
      font-size: 2rem;
      color: var(--light-pink);
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      transition: transform .2s;
    }
    #lb-close:hover { transform: scale(1.3) rotate(90deg); }

    #lb-prev, #lb-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,107,157,.2);
      border: 1px solid rgba(255,107,157,.4);
      color: white;
      font-size: 1.8rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, transform .2s;
    }
    #lb-prev:hover, #lb-next:hover {
      background: rgba(255,107,157,.5);
      transform: translateY(-50%) scale(1.1);
    }
    #lb-prev { left: 20px; }
    #lb-next { right: 20px; }

    #lb-counter {
      position: absolute;
      bottom: 22px;
      color: var(--light-pink);
      font-size: .85rem;
      letter-spacing: .1em;
    }

    @media(max-width:800px) {
      .gallery-grid { grid-template-columns: repeat(3,1fr); }
    }
    @media(max-width:480px) {
      .gallery-grid { grid-template-columns: repeat(2,1fr); }
    }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      padding: 60px 20px 20px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-style: italic;
      color: var(--light-pink);
      line-height: 1.9;
    }

/* ── SPARKLE ── */
    .sparkle-el {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      animation: sparkleOut .9s forwards;
    }
    @keyframes sparkleOut {
      0%   { transform: scale(0) rotate(0deg);   opacity:1; }
      50%  { transform: scale(1.3) rotate(180deg); opacity:1; }
      100% { transform: scale(0) rotate(360deg) translateY(-60px); opacity:0; }
    }


  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- INTRO -->
<div id="intro">
  <div class="intro-heart" id="mainHeart">❤️</div>
  <p class="intro-tagline">Hay algo que quiero que sepas…</p>
  <p class="intro-hint">✨ toca el corazón ✨</p>
</div>

<!-- PAGE -->
<div id="page">

  <!-- GALLERY -->

  <div class="gallery-section">
    <h2 class="gallery-title">Momentos que guardo en mi corazón</h2>
    <p class="gallery-sub">Cada foto, un recuerdo que vale mil palabras 🌹</p>

    <div class="gallery-grid" id="galleryGrid">
      <div class="gallery-item" data-idx="0"><img src="imagenes/1.jpeg" alt="" /><div class="overlay"><span>💕</span></div></div>
      <div class="gallery-item" data-idx="1"><img src="imagenes/2.jpeg" alt="" /><div class="overlay"><span>🌹</span></div></div>
      <div class="gallery-item" data-idx="2"><img src="imagenes/3.jpeg" alt="" /><div class="overlay"><span>✨</span></div></div>
      <div class="gallery-item" data-idx="3"><img src="imagenes/4.jpeg" alt="" /><div class="overlay"><span>💖</span></div></div>
      <div class="gallery-item" data-idx="4"><img src="imagenes/5.jpeg" alt="" /><div class="overlay"><span>💕</span></div></div>
      <div class="gallery-item" data-idx="5"><img src="imagenes/6.jpeg" alt="" /><div class="overlay"><span>🌟</span></div></div>
      <div class="gallery-item" data-idx="6"><img src="imagenes/7.jpeg" alt="" /><div class="overlay"><span>💗</span></div></div>
      <div class="gallery-item" data-idx="7"><img src="imagenes/8.jpeg" alt="" /><div class="overlay"><span>❤️</span></div></div>
      <div class="gallery-item" data-idx="8"><img src="imagenes/9.jpeg" alt="" /><div class="overlay"><span>💕</span></div></div>
      <div class="gallery-item" data-idx="9"><img src="imagenes/10.jpeg" alt="" /><div class="overlay"><span>🌹</span></div></div>
      <div class="gallery-item" data-idx="10"><img src="imagenes/11.jpeg" alt="" /><div class="overlay"><span>✨</span></div></div>
      <div class="gallery-item" data-idx="11"><img src="imagenes/12.jpeg" alt="" /><div class="overlay"><span>💖</span></div></div>
      <div class="gallery-item" data-idx="12"><img src="imagenes/13.jpeg" alt="" /><div class="overlay"><span>💗</span></div></div>
      <div class="gallery-item" data-idx="13"><img src="imagenes/14.jpeg" alt="" /><div class="overlay"><span>🌟</span></div></div>
      <div class="gallery-item" data-idx="14"><img src="imagenes/15.jpeg" alt="" /><div class="overlay"><span>❤️</span></div></div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox">
    <button id="lb-close">✕</button>
    <button id="lb-prev">‹</button>
    <img id="lb-img" src="" alt="" />
    <button id="lb-next">›</button>
    <span id="lb-counter"></span>
  </div>

  <div class="footer">
    Cada nota, cada palabra, cada melodía…<br>
    todas te hablan a ti. 🌹
  </div>

</div>

<script>
// ───── PARTICLES ─────
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

class Star {
  constructor() { this.init(); }
  init() {
    this.x  = Math.random() * canvas.width;
    this.y  = Math.random() * canvas.height;
    this.r  = Math.random() * 1.5 + .3;
    this.vx = (Math.random() - .5) * .2;
    this.vy = -Math.random() * .4 - .05;
    this.a  = Math.random() * .5 + .1;
    this.hue = Math.random() * 60 + 300; // pink-purple
  }
  step() {
    this.x += this.vx; this.y += this.vy;
    if (this.y < -5) this.init();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${this.hue},80%,70%,${this.a})`;
    ctx.fill();
  }
}

const stars = Array.from({length: 120}, () => new Star());

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => { s.step(); s.draw(); });
  requestAnimationFrame(loop);
}
loop();

// ───── INTRO ─────
const intro    = document.getElementById('intro');
const page     = document.getElementById('page');
const mainHrt  = document.getElementById('mainHeart');

mainHrt.addEventListener('click', () => {
  for (let i = 0; i < 24; i++) {
    setTimeout(() => burst(
      innerWidth/2 + (Math.random()-.5)*220,
      innerHeight/2 + (Math.random()-.5)*220
    ), i * 45);
  }
  intro.classList.add('hidden');
  setTimeout(() => {
    intro.style.display = 'none';
    page.classList.add('show');
    animateGallery();
  }, 1100);
});



// ───── BURST SPARKLES ─────
const SPARKS = ['✨','💖','⭐','🌟','💕','🌹','💗'];
function burst(x, y) {
  const el = document.createElement('div');
  el.className = 'sparkle-el';
  el.textContent = SPARKS[Math.floor(Math.random() * SPARKS.length)];
  el.style.cssText = `left:${x}px;top:${y}px;font-size:${Math.random()*18+14}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}


// ───── GALLERY + LIGHTBOX ─────
const galleryItems = document.querySelectorAll('.gallery-item');
const imgs = Array.from(galleryItems).map(el => el.querySelector('img').src);
let currentIdx = 0;

const lightbox  = document.getElementById('lightbox');
const lbImg     = document.getElementById('lb-img');
const lbCounter = document.getElementById('lb-counter');
const lbClose   = document.getElementById('lb-close');
const lbPrev    = document.getElementById('lb-prev');
const lbNext    = document.getElementById('lb-next');

function openLightbox(idx) {
  currentIdx = idx;
  lbImg.src = imgs[idx];
  lbCounter.textContent = `${idx + 1} / ${imgs.length}`;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

function showLb(dir) {
  currentIdx = (currentIdx + dir + imgs.length) % imgs.length;
  lbImg.style.animation = 'none';
  lbImg.offsetHeight;
  lbImg.style.animation = '';
  lbImg.src = imgs[currentIdx];
  lbCounter.textContent = `${currentIdx + 1} / ${imgs.length}`;
}

galleryItems.forEach((item, i) => {
  item.addEventListener('click', () => { openLightbox(i); burst(event.clientX, event.clientY); });
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
lbPrev.addEventListener('click', e => { e.stopPropagation(); showLb(-1); });
lbNext.addEventListener('click', e => { e.stopPropagation(); showLb(1); });

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'ArrowLeft')  showLb(-1);
  if (e.key === 'ArrowRight') showLb(1);
  if (e.key === 'Escape')     closeLightbox();
});

// Gallery scroll animation
function animateGallery() {
  const io2 = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const idx = [...galleryItems].indexOf(e.target);
        setTimeout(() => e.target.classList.add('pop'), idx * 55);
        io2.unobserve(e.target);
      }
    });
  }, { threshold: .1 });
  galleryItems.forEach(g => io2.observe(g));
}

</script>
</body>
</html>
